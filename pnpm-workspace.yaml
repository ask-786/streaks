packages:
  - '.'

# Native resolver used by eslint-import-resolver-typescript; without its build
# step pnpm prints an "ignored build scripts" warning on every install.
onlyBuiltDependencies:
  - unrs-resolver

overrides:
  '@xmldom/xmldom@<0.8.12': '^0.8.12'
  brace-expansion@<1.1.13: '^1.1.13'
  brace-expansion@>=4.0.0 <5.0.5: '^5.0.5'
  lodash@<=4.17.23: '^4.17.21'
  lodash@>=4.0.0 <=4.17.23: '^4.17.21'
  node-forge@<1.4.0: '^1.4.0'
  picomatch@<2.3.2: '^2.3.2'
  picomatch@>=4.0.0 <4.0.4: '^4.0.4'
  yaml@>=2.0.0 <2.8.3: '^2.8.3'
